name: Update Data and Consensus

on:
  schedule:
    # 北京时间 09:30 和次日 01:30
    - cron: '30 1,17 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Sync upstream data
        run: |
          base=https://raw.githubusercontent.com/sinyu1012/Double-Color-Ball-AI/main
          curl -fsSL "$base/data/lottery_history.json" -o data/lottery_history.json
          curl -fsSL "$base/data/ai_predictions.json" -o data/ai_predictions.json
          curl -fsSL "$base/data/predictions_history.json" -o data/predictions_history.json

      - name: Generate rule engine predictions
        run: python3 offline_prediction.py

      - name: Generate frequency consensus
        run: python3 ensemble_prediction.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "chore: update data and consensus $(date -u +'%Y-%m-%d %H:%M:%S')"
            git push
          fi
